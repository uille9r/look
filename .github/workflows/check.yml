name: 检查字幕统计
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v
# 该配置已在 GitHub Actions 上实际运行并通过（main / feature / baseline 共 4 次）。
